[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sm-divergence"
version = "0.13.0"
description = "Catch a cheating registry by corroboration — omission/endpoint/DID + cross-DID-method key divergence for federated agent discovery, on the sm-resolver kernel."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sharath (Stellarminds)" }]
keywords = ["ai-agents", "nanda", "registry", "discovery", "federation", "accountability"]
dependencies = [
    "httpx>=0.24",
    "sm-resolver>=0.7",
]

[project.optional-dependencies]
# Verified-DID divergence needs Ed25519 + did:key decoding; kept optional so
# the omission/endpoint checks stay dependency-light.
attestation = ["cryptography>=42", "base58>=2.1", "jcs>=0.2.1"]
# DNS as a discovery source (SVCB / TXT). Imported only when a default DNS query
# is built, so every other resolver stays httpx-only.
dns = ["dnspython>=2.6"]
# Verifying a transparency log's signed receipt and status token (COSE_Sign1).
# Imported on first use only.
cose = ["cbor2>=5.6", "cryptography>=42"]
# Everything AnsLogResolver can use: attested zone records and verification.
ans = ["dnspython>=2.6", "cbor2>=5.6", "cryptography>=42"]
# The live demo site (demo/): every source adapter, signed records, an ASGI server.
site = [
    "starlette>=0.40",
    "uvicorn>=0.30",
    "dnspython>=2.6",
    "cbor2>=5.6",
    "cryptography>=42",
    "base58>=2.1",
    "jcs>=0.2.1",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
    "cryptography>=42",
    "base58>=2.1",
    "jcs>=0.2.1",
    "dnspython>=2.6",
    "cbor2>=5.6",
    "starlette>=0.40",
]

[project.scripts]
sm-divergence = "sm_divergence.cli:main"

[project.urls]
Homepage = "https://github.com/Sharathvc23/sm-divergence"
Spec = "https://github.com/Sharathvc23/sm-divergence/blob/main/SPEC.md"
Whitepaper = "https://github.com/Sharathvc23/sm-divergence/blob/main/WHITEPAPER.md"

[tool.hatch.build.targets.wheel]
packages = ["sm_divergence"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["sm_divergence"]

# The kernel (sm-resolver) is a sibling repo released on its own cadence and
# normally resolves from PyPI. While a kernel bump is not yet on PyPI, resolve
# it from git at a pinned commit so this repo is never red waiting on the
# sibling release (uv's error for that case misleadingly hints at Python
# versions), then switch back and `uv lock` once it is published. The release
# workflow refuses to publish until the floor above is on PyPI either way.
#
# [tool.uv.sources]
# sm-resolver = { git = "https://github.com/Sharathvc23/sm-resolver", rev = "<commit>" }
